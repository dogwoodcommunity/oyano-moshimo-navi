name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web-and-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web
        run: pnpm --filter web run typecheck

      - name: Typecheck mobile
        run: pnpm --filter mobile run typecheck

      - name: Test monitor timeline
        run: pnpm run test:monitor-timeline

      - name: Test monitor retention
        run: pnpm run test:monitor-retention

      - name: Test monitor submission gate
        run: pnpm run test:monitor-submission-gate

      - name: Test cron authentication
        run: pnpm run test:cron-auth

      - name: Test notebook sync safety
        run: pnpm run test:notebook-sync-safety

      - name: Test notebook sync runtime
        run: pnpm run test:notebook-sync-runtime

      - name: Test memory book export safety
        run: pnpm run test:memory-book-export

      - name: Test free-first redesign
        run: pnpm run test:free-first-redesign

      - name: Test home overview reachability
        run: pnpm run test:home-overview-reachability

      - name: Test web account deletion
        run: pnpm run test:web-account-deletion

      - name: Test least-privilege account deletion operator
        run: pnpm run test:account-delete-executor

      - name: Test deletion operator MFA setup
        run: pnpm run test:delete-operator-mfa-setup

      - name: Test verified account erasure PostgreSQL pipeline
        run: pnpm run test:account-erasure:sql

      - name: Test commercial release gates
        run: pnpm run test:commercial-release-gates

      - name: Test family roles and signed upload authorization
        run: pnpm run test:family-role-security

      - name: Test explicit family invite permissions
        run: pnpm run test:family-invite-permissions

      - name: Test family role PostgreSQL RLS
        run: pnpm run test:family-role-security:sql

      - name: Test family management
        run: pnpm run test:family-management

      - name: Test family management PostgreSQL transactions
        run: pnpm run test:family-management:sql

      - name: Test explicit family context selection
        run: pnpm run test:family-context-selection

      - name: Test anonymous diagnosis and handoff route security
        run: pnpm run test:handoff-security

      - name: Test anonymous diagnosis and handoff PostgreSQL security
        run: pnpm run test:handoff-security:sql

      - name: Test consult memory
        run: pnpm run test:consult-memory

      - name: Test consult memory PostgreSQL RLS
        run: pnpm run test:consult-memory:sql

      - name: Test atomic daily free consultation claim
        run: pnpm run test:consult-daily-claim:sql

      - name: Test diary deletion
        run: pnpm run test:diary-deletion

      - name: Test diary deletion PostgreSQL transactions
        run: pnpm run test:diary-deletion:sql

      - name: Test whole-person notebook deletion
        run: pnpm run test:person-deletion

      - name: Test whole-person notebook deletion PostgreSQL transactions
        run: pnpm run test:person-deletion:sql

      - name: Build web
        run: pnpm --filter web run build

      - name: Smoke web
        run: |
          pnpm --filter web exec next start -p 3000 &
          sleep 5
          node scripts/smoke-web.mjs http://localhost:3000
